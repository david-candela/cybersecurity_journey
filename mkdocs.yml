site_name: David Candela — Cybersecurity Journey
site_description: Documenting my transition into cybersecurity — labs, notes, and write-ups.
site_author: David Candela Martínez
site_url: https://david-candela.github.io/cybersecurity_journey/

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false
  icon:
    logo: material/shield-lock
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  # Single font request, weights narrowed to what the design system uses
  # (theme.font is disabled; --md-text-font/--md-code-font set in extra.css)
  - https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,500&display=swap
  - stylesheets/extra.css

extra_javascript:
  - javascripts/cv-header.js

repo_url: https://github.com/david-candela/cybersecurity_journey
repo_name: david-candela/cybersecurity_journey

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - tags

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/david-candela
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/david-candela-martinez/
  analytics:
    provider: google
    property: G-8ER2FJJT0M

copyright: "&copy; 2026 David Candela Martínez"

nav:
  - Home: index.md
  - TryHackMe:
      - tryhackme/index.md
      - Phishing Challenge 1: tryhackme/phishing-challenge-1.md
      - MITRE ATT&CK Framework: tryhackme/MITRE.md
      - Blue: tryhackme/blue.md
  - Notes:
      - notes/index.md
      - Linux:
          - Linux Commands: notes/linux-commands.md
          - Linux Shells: notes/linux-shells.md
      - Windows:
          - PowerShell: notes/windows-powershell.md
          - Command Line: notes/windows-command-line.md
      - Security Tools:
          - Nmap: notes/Nmap.md
          - Tcpdump: notes/Tcpdump.md
  - Resources: resources/index.md
  - "Portfolio ↗": https://david-candela.github.io/cybersecurity_journey/showcase/
